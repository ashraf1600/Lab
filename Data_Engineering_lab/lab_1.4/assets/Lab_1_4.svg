<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155" />
    </marker>
    <!-- Dashed arrow marker -->
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <!-- Card Shadow -->
    <filter id="drop-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1100" height="420" rx="16" fill="#ffffff" />

  <!-- Top Title Banner -->
  <g transform="translate(360, 20)">
    <rect width="380" height="42" rx="10" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5" />
    <text x="190" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="0.3">QuickCart – Schema Evolution Architecture</text>
  </g>

  <!-- ================= 1. Order Service (Producer) ================= -->
  <g transform="translate(30, 95)" filter="url(#drop-shadow)">
    <!-- Container -->
    <rect width="180" height="200" rx="12" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2" />
    <!-- Title -->
    <text x="90" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0369a1" text-anchor="middle">Order Service</text>
    <text x="90" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0284c7" text-anchor="middle">(Producer)</text>
    
    <!-- Shopping Cart Icon -->
    <g transform="translate(73, 58)">
      <path d="M 4 2 L 9 2 L 14 16 L 28 16 L 32 6 L 10 6" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="16" cy="22" r="2.5" fill="#0f172a" />
      <circle cx="26" cy="22" r="2.5" fill="#0f172a" />
    </g>

    <!-- Inner JSON Box -->
    <rect x="15" y="90" width="150" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="25" y="110" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1e293b">JSON Event</text>
    <text x="25" y="128" font-family="'Courier New', monospace" font-size="10.5" fill="#334155">{</text>
    <text x="32" y="144" font-family="'Courier New', monospace" font-size="10" fill="#0284c7">"order_id": "ORD001",</text>
    <text x="32" y="160" font-family="'Courier New', monospace" font-size="10" fill="#0284c7">"amount": 650,</text>
    <text x="32" y="174" font-family="'Courier New', monospace" font-size="10" fill="#64748b">...</text>
    <text x="25" y="182" font-family="'Courier New', monospace" font-size="10.5" fill="#334155">}</text>
  </g>

  <!-- Flow Arrow: Producer to Message Broker -->
  <line x1="210" y1="195" x2="248" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ================= 2. Message Broker (e.g., Kafka) ================= -->
  <g transform="translate(250, 115)" filter="url(#drop-shadow)">
    <!-- Container -->
    <rect width="170" height="160" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" />
    <!-- Title -->
    <text x="85" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">Message Broker</text>
    <text x="85" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#78350f" text-anchor="middle">(e.g., Kafka)</text>

    <!-- Kafka Nodes Icon -->
    <g transform="translate(65, 68)">
      <!-- Left main node -->
      <circle cx="20" cy="40" r="10" fill="#0f172a" />
      <!-- Upper right node -->
      <circle cx="36" cy="18" r="7" fill="#0f172a" />
      <!-- Lower right node -->
      <circle cx="36" cy="62" r="7" fill="#0f172a" />
      <!-- Connecting lines -->
      <line x1="20" y1="40" x2="36" y2="18" stroke="#0f172a" stroke-width="3" />
      <line x1="20" y1="40" x2="36" y2="62" stroke="#0f172a" stroke-width="3" />
      <!-- Dots inside -->
      <circle cx="20" cy="40" r="4" fill="#ffffff" />
      <circle cx="36" cy="18" r="3" fill="#ffffff" />
      <circle cx="36" cy="62" r="3" fill="#ffffff" />
    </g>
  </g>

  <!-- Flow Arrow: Broker to Consumer -->
  <line x1="420" y1="195" x2="458" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ================= 3. Consumer Service ================= -->
  <g transform="translate(460, 95)" filter="url(#drop-shadow)">
    <!-- Container -->
    <rect width="180" height="200" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2" />
    <!-- Title -->
    <text x="90" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Consumer Service</text>
    <text x="90" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#166534" text-anchor="middle">(e.g., Billing / Analytics)</text>

    <!-- Gear Icon -->
    <g transform="translate(74, 58)">
      <path d="M16 11.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zm-1.8-8.5h3.6l.6 3.1c.6.2 1.2.6 1.8 1l2.8-1.5 2.5 2.5-1.5 2.8c.4.6.8 1.2 1 1.8l3.1.6v3.6l-3.1.6c-.2.6-.6 1.2-1 1.8l1.5 2.8-2.5 2.5-2.8-1.5c-.6.4-1.2.8-1.8 1l-.6 3.1h-3.6l-.6-3.1c-.6-.2-1.2-.6-1.8-1l-2.8 1.5-2.5-2.5 1.5-2.8c-.4-.6-.8-1.2-1-1.8l-3.1-.6v-3.6l3.1-.6c.2-.6.6-1.2 1-1.8l-1.5-2.8 2.5-2.5 2.8 1.5c.6-.4 1.2-.8 1.8-1l.6-3.1z" fill="#334155" transform="scale(0.85)" />
    </g>

    <!-- Inner Process Box -->
    <rect x="15" y="90" width="150" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="25" y="110" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1e293b">Validate &amp; Process</text>
    <text x="25" y="128" font-family="'Courier New', monospace" font-size="10.5" fill="#334155">{</text>
    <text x="32" y="144" font-family="'Courier New', monospace" font-size="10" fill="#16a34a">"order_id": "ORD001",</text>
    <text x="32" y="160" font-family="'Courier New', monospace" font-size="10" fill="#16a34a">"amount": 650,</text>
    <text x="32" y="174" font-family="'Courier New', monospace" font-size="10" fill="#64748b">...</text>
    <text x="25" y="182" font-family="'Courier New', monospace" font-size="10.5" fill="#334155">}</text>
  </g>

  <!-- Flow Arrow: Consumer to Schema Evolution -->
  <line x1="640" y1="195" x2="678" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ================= 4. Schema Evolution Box ================= -->
  <g transform="translate(680, 95)" filter="url(#drop-shadow)">
    <!-- Container with dashed border -->
    <rect width="180" height="200" rx="12" fill="#faf5ff" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="5 4" />
    <!-- Header Badge -->
    <rect x="15" y="12" width="150" height="28" rx="6" fill="#f3e8ff" />
    <text x="90" y="31" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#7e22ce" text-anchor="middle">Schema Evolution</text>

    <!-- Pill 1: Add Field (Non-breaking) -->
    <g transform="translate(15, 52)">
      <rect width="150" height="38" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1" />
      <circle cx="22" cy="19" r="10" fill="#16a34a" />
      <!-- Plus sign -->
      <path d="M 22 13 L 22 25 M 16 19 L 28 19" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <text x="40" y="17" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#15803d">Add Field</text>
      <text x="40" y="30" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="500" fill="#166534">(Non-breaking)</text>
    </g>

    <!-- Pill 2: Remove Field (Breaking) -->
    <g transform="translate(15, 100)">
      <rect width="150" height="38" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1" />
      <circle cx="22" cy="19" r="10" fill="#dc2626" />
      <!-- Minus sign -->
      <path d="M 16 19 L 28 19" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <text x="40" y="17" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Remove Field</text>
      <text x="40" y="30" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="500" fill="#991b1b">(Breaking)</text>
    </g>

    <!-- Pill 3: Rename Field (Breaking) -->
    <g transform="translate(15, 148)">
      <rect width="150" height="38" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1" />
      <!-- Pencil icon -->
      <g transform="translate(14, 11)">
        <path d="M 12 4 L 14 6 L 6 14 L 3 14 L 3 11 Z" fill="#dc2626" />
      </g>
      <text x="40" y="17" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Rename Field</text>
      <text x="40" y="30" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="500" fill="#991b1b">(Breaking)</text>
    </g>
  </g>

  <!-- Flow Arrow: Schema Evolution to Compatibility Check -->
  <line x1="860" y1="195" x2="888" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ================= 5. Compatibility Check & Governance ================= -->
  <g transform="translate(890, 95)" filter="url(#drop-shadow)">
    <!-- Container -->
    <rect width="180" height="200" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2" />
    <!-- Title -->
    <text x="90" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#6b21a8" text-anchor="middle">Compatibility Check</text>
    <text x="90" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#7e22ce" text-anchor="middle">&amp; Schema Governance</text>

    <!-- Clipboard Checklist Icon -->
    <g transform="translate(73, 56)">
      <rect x="4" y="2" width="24" height="30" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
      <rect x="10" y="0" width="12" height="4" rx="1.5" fill="#334155" />
      <!-- Checks -->
      <path d="M 9 12 L 12 15 L 17 9" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 9 20 L 12 23 L 17 17" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="19" y1="13" x2="24" y2="13" stroke="#64748b" stroke-width="1.5" />
      <line x1="19" y1="21" x2="24" y2="21" stroke="#64748b" stroke-width="1.5" />
    </g>

    <!-- Bullets -->
    <g transform="translate(18, 106)">
      <circle cx="6" cy="8" r="2.5" fill="#0f172a" />
      <text x="14" y="12" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1e293b">Validate schema</text>

      <circle cx="6" cy="28" r="2.5" fill="#0f172a" />
      <text x="14" y="32" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1e293b">Check compatibility</text>

      <circle cx="6" cy="48" r="2.5" fill="#0f172a" />
      <text x="14" y="52" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1e293b">Allow / Reject change</text>

      <circle cx="6" cy="68" r="2.5" fill="#0f172a" />
      <text x="14" y="72" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1e293b">Version control</text>
    </g>
  </g>

  <!-- ================= 6. Bottom: Schema Registry / Governance ================= -->
  <g transform="translate(370, 335)" filter="url(#drop-shadow)">
    <rect width="360" height="65" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2" />
    
    <!-- Database Icon -->
    <g transform="translate(20, 16)">
      <ellipse cx="14" cy="8" rx="12" ry="4" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
      <path d="M 2 8 v 10 c 0 2.2 5.4 4 12 4 s 12 -1.8 12 -4 v -10" fill="none" stroke="#0284c7" stroke-width="1.5" />
      <path d="M 2 18 v 10 c 0 2.2 5.4 4 12 4 s 12 -1.8 12 -4 v -10" fill="none" stroke="#0284c7" stroke-width="1.5" />
    </g>

    <!-- Title and Bullet Text -->
    <text x="65" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0369a1">Schema Registry / Governance</text>
    <g transform="translate(70, 34)">
      <circle cx="4" cy="6" r="2" fill="#0284c7" />
      <text x="11" y="9" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Store schema versions</text>

      <circle cx="4" cy="20" r="2" fill="#0284c7" />
      <text x="11" y="23" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Enforce compatibility rules</text>
    </g>
  </g>

  <!-- Dashed Connecting Lines from Schema Registry -->
  <!-- Left path to Producer -->
  <path d="M 370 368 L 120 368 L 120 300" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-dash)" />
  <!-- Right path to Governance Gate -->
  <path d="M 730 368 L 980 368 L 980 300" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-dash)" />

</svg>
