<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 500" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="softShadowSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
    <marker id="arrowHeadBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1F6FEB"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="500" fill="#ffffff"/>

  <!-- ===================== CLIENT SIDE BOX ===================== -->
  <rect x="40" y="40" width="400" height="360" rx="10" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" filter="url(#softShadow)"/>
  <text x="80" y="65" font-size="15" font-weight="bold" fill="#1a1a1a">Client Side (On-Prem / Remote)</text>
  <text x="80" y="85" font-size="12" fill="#333333">Hospital / Office / Remote User</text>

  <!-- Client Application inner box -->
  <rect x="60" y="100" width="280" height="220" rx="8" fill="#ffffff" stroke="#6C8EBF" stroke-width="1.5" filter="url(#softShadowSmall)"/>
  <text x="200" y="140" font-size="30" text-anchor="middle">🔊</text>
  <text x="200" y="168" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Client Application</text>
  <text x="200" y="184" font-size="11" text-anchor="middle" fill="#333333">(Send audio → Get transcript)</text>
  <text x="80" y="210" font-size="11.5" fill="#222222">1. Record/Upload audio file</text>
  <text x="80" y="230" font-size="11.5" fill="#222222">2. Send via encrypted tunnel</text>
  <text x="80" y="250" font-size="11.5" fill="#222222">3. Receive transcription result</text>

  <!-- Customer Gateway -->
  <circle cx="400" cy="200" r="32" fill="#9673A6" stroke="#76608A" stroke-width="1.5" filter="url(#softShadowSmall)"/>
  <text x="400" y="209" font-size="22" text-anchor="middle" fill="#ffffff">⇄</text>
  <text x="400" y="250" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Customer Gateway</text>
  <text x="400" y="264" font-size="11" text-anchor="middle" fill="#333333">(IPSec VPN)</text>

  <!-- ===================== TUNNEL ===================== -->
  <text x="580" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">IPSec Tunnel</text>
  <text x="580" y="156" font-size="11" text-anchor="middle" fill="#333333">(Encrypted - AES-256)</text>

  <!-- tunnel body -->
  <rect x="460" y="180" width="240" height="40" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5" opacity="0.55"/>
  <ellipse cx="460" cy="200" rx="10" ry="20" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5" opacity="0.55"/>
  <ellipse cx="700" cy="200" rx="10" ry="20" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5" opacity="0.55"/>
  <text x="580" y="208" font-size="20" text-anchor="middle" fill="#1F5C99">🔒</text>

  <!-- flowing animated dash line through tunnel (data flow) -->
  <line x1="432" y1="200" x2="720" y2="200" stroke="#1F6FEB" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- Internet cloud -->
  <ellipse cx="580" cy="270" rx="45" ry="30" fill="#F5F5F5" stroke="#666666" stroke-width="1.5" filter="url(#softShadowSmall)"/>
  <text x="580" y="278" font-size="24" text-anchor="middle">🌐</text>
  <text x="580" y="320" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Internet</text>

  <!-- Virtual Private Gateway -->
  <circle cx="760" cy="200" r="32" fill="#9673A6" stroke="#76608A" stroke-width="1.5" filter="url(#softShadowSmall)"/>
  <text x="760" y="209" font-size="20" text-anchor="middle" fill="#ffffff">🔒</text>
  <text x="760" y="250" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Virtual Private</text>
  <text x="760" y="264" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Gateway</text>
  <text x="760" y="278" font-size="11" text-anchor="middle" fill="#333333">(IPSec VPN)</text>

  <!-- ===================== AWS CLOUD BOX ===================== -->
  <rect x="830" y="40" width="440" height="360" rx="10" fill="#ffffff" stroke="#2D7D46" stroke-width="2" filter="url(#softShadow)"/>
  <text x="900" y="62" font-size="26">☁️</text>
  <text x="935" y="62" font-size="15" font-weight="bold" fill="#1a1a1a">AWS Cloud</text>
  <text x="900" y="82" font-size="12" fill="#333333">VPC with Private Whisper Model</text>

  <!-- VPC container -->
  <rect x="860" y="100" width="380" height="270" rx="8" fill="#F1F8F2" stroke="#2D7D46" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="895" y="122" font-size="13" font-weight="bold" fill="#1a1a1a">VPC (e.g. 10.0.0.0/16)</text>

  <!-- Private Subnet container -->
  <rect x="885" y="150" width="330" height="195" rx="8" fill="#DAE8FC" stroke="#1F5C99" stroke-width="1.5" filter="url(#softShadowSmall)"/>
  <text x="920" y="172" font-size="13" font-weight="bold" fill="#1F5C99">🔒 Private Subnet</text>
  <text x="920" y="188" font-size="11" fill="#1F5C99">(e.g. 10.0.1.0/24)</text>

  <!-- Whisper Model Server -->
  <rect x="960" y="215" width="70" height="70" rx="4" fill="#F5A623" stroke="#B9770E" stroke-width="1.5" filter="url(#softShadowSmall)"/>
  <text x="995" y="260" font-size="28" text-anchor="middle" fill="#ffffff">🖥️</text>
  <text x="995" y="303" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Whisper Model Server</text>
  <text x="995" y="317" font-size="11" text-anchor="middle" fill="#333333">(FastAPI + Whisper)</text>

  <!-- Model Files cylinder -->
  <path d="M1150,235 a30,10 0 1,0 60,0 v40 a30,10 0 1,1 -60,0 z" fill="#2D7D46" stroke="#1E5631" stroke-width="1.5" filter="url(#softShadowSmall)"/>
  <ellipse cx="1180" cy="235" rx="30" ry="10" fill="#3A9457" stroke="#1E5631" stroke-width="1.5"/>
  <text x="1180" y="300" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Model Files</text>
  <text x="1180" y="314" font-size="11" text-anchor="middle" fill="#333333">(EBS / S3)</text>

  <!-- ===================== CONNECTIONS ===================== -->

  <!-- Client App -> Customer Gateway -->
  <line x1="340" y1="200" x2="366" y2="200" stroke="#333333" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- Customer GW -> tunnel start (animated) -->
  <line x1="432" y1="200" x2="460" y2="200" stroke="#333333" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- tunnel end -> VPGW -->
  <line x1="700" y1="200" x2="726" y2="200" stroke="#333333" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- VPGW -> Whisper server (bent path), animated flow -->
  <path id="vpgwToWhisper" d="M 760 232 L 760 260 L 960 260" fill="none" stroke="#1F6FEB" stroke-width="2.5" marker-end="url(#arrowHeadBlue)" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- Whisper -> Model Files -->
  <line x1="1030" y1="250" x2="1148" y2="250" stroke="#333333" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- ===================== BOTTOM FLOW ===================== -->

  <!-- Audio File -> AWS (forward flow, animated) -->
  <text x="300" y="435" font-size="22">🎵</text>
  <text x="345" y="430" font-size="12" font-weight="bold" fill="#1a1a1a">Audio File</text>
  <text x="345" y="445" font-size="11" fill="#333333">(Encrypted over IPSec)</text>
  <path d="M 200 460 L 995 460" fill="none" stroke="#1F6FEB" stroke-width="2.5" marker-end="url(#arrowHeadBlue)" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- Transcription Result -> Client (return flow) -->
  <text x="720" y="435" font-size="22">📄</text>
  <text x="765" y="430" font-size="12" font-weight="bold" fill="#1a1a1a">Transcription Result</text>
  <text x="765" y="445" font-size="11" fill="#333333">(Encrypted over IPSec)</text>
  <path d="M 995 480 L 200 480" fill="none" stroke="#2D7D46" stroke-width="2.5" marker-end="url(#arrowHead)" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- connecting verticals for bottom flow -->
  <line x1="200" y1="460" x2="200" y2="480" stroke="#1F6FEB" stroke-width="0" />
</svg>
