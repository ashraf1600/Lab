log syslog all;
router id 10.0.1.10;

protocol device {
}

protocol direct {
    ipv4;
}

protocol kernel {
    ipv4 {
        export all;
        import all;
    };
}

protocol bgp aws_tunnel1 {
    local 169.254.10.2 as 65000;
    neighbor 169.254.10.1 as 64512;
    connect retry time 5;
    connect delay time 2;
    hold time 30;
    ipv4 {
        import all;
        export where net = 10.0.0.0/16;
    };
}
